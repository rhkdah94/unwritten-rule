<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불문율 (BULMUNYUL) - 전투력 랭킹</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #b45309;
            --border: #334155;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg-main); color: var(--text-primary); margin: 0; padding: 20px; }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        /* 헤더 디자인 */
        header { text-align: center; margin-bottom: 30px; padding: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        header h1 { color: var(--accent); font-size: 26px; margin: 0 0 8px 0; text-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        header p { color: var(--text-secondary); margin: 0; font-size: 14px; }

        /* 메인 카드 및 테이블 */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 15px; }
        th { background: #0f172a; color: var(--accent); font-weight: 600; }
        tr:hover td { background: var(--bg-card-hover); }
        
        .rank { font-weight: bold; text-align: center; width: 70px; }
        .rank-1 { color: var(--gold); font-size: 17px; }
        .rank-2 { color: var(--silver); font-size: 16px; }
        .rank-3 { color: var(--bronze); font-size: 16px; }
        
        .loading, .error { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 15px; }
        .error { color: #f43f5e; }
        
        footer { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚔️ 불문율 (BULMUNYUL) 길드 랭킹</h1>
            <p>제우스 오만의신 | 구글 시트 실시간 연동 시스템</p>
        </header>
        
        <div class="card">
            <div id="loading" class="loading">구글 시트에서 랭킹 데이터를 불러오는 중입니다...</div>
            <div id="error" class="error" style="display:none;"></div>
            <div class="table-wrapper">
                <table id="rankTable" style="display: none;">
                    <thead>
                        <tr>
                            <th class="rank">순위</th>
                            <th>캐릭터명</th>
                            <th>직업</th>
                            <th>전투력</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <footer>
            © 2026 BULMUNYUL GUILD. All rights reserved.
        </footer>
    </div>

    <script>
        // 구글 시트 연동 주소
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSEnzrZjlL9xsghEn2UwvULebdfVxxDkdX_bqXZpprWKMwFv-zEf8QYo-WtE95nDXCqPlBLCc2v71vG/pub?output=csv';

        async function loadData() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('데이터를 불러오지 못했습니다.');
                const text = await response.text();
                parseAndRender(text);
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                const errEl = document.getElementById('error');
                errEl.style.display = 'block';
                errEl.innerText = '로드 실패: ' + err.message;
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(line => {
                const row = [];
                let inQuotes = false;
                let current = '';
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                return row.map(cell => cell.replace(/^"|"$/g, ''));
            });
            return lines.filter(row => row.some(cell => cell !== ''));
        }

        function parseAndRender(csvText) {
            const rows = parseCSV(csvText);
            if (rows.length === 0) throw new Error('시트에 데이터가 없습니다.');

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let validRank = 1;

            rows.forEach((cols) => {
                const firstCol = cols[0] || '';
                // 안내 문구나 불필요한 빈 행 자동 필터링
                if (firstCol.includes('※') || firstCol.includes('순위') || firstCol === '' || cols.length < 3) {
                    return;
                }

                const tr = document.createElement('tr');
                let rankClass = 'rank';
                let rankDisplay = validRank;

                if (validRank === 1) { rankClass += ' rank-1'; rankDisplay = '🥇 1위'; }
                else if (validRank === 2) { rankClass += ' rank-2'; rankDisplay = '🥈 2위'; }
                else if (validRank === 3) { rankClass += ' rank-3'; rankDisplay = '🥉 3위'; }

                tr.innerHTML = `
                    <td class="${rankClass}">${rankDisplay}</td>
                    <td><strong>${cols[0] || ''}</strong></td>
                    <td>${cols[1] || ''}</td>
                    <td>${cols[2] || ''}</td>
                `;
                tbody.appendChild(tr);
                validRank++;
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('rankTable').style.display = 'table';
        }

        loadData();
    </script>
</body>
</html>
