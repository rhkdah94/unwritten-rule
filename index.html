<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불문율 길드 - 전투력 랭킹</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #b45309;
            --border: #334155;
        }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg-main); color: var(--text-primary); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--accent); font-size: 32px; margin-bottom: 5px; text-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        header p { color: var(--text-secondary); margin: 0; font-size: 15px; }
        
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; }
        
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        th, td { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 15px; }
        th { background: #0f172a; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:hover td { background: var(--bg-card-hover); }
        
        .rank { font-weight: bold; text-align: center; width: 60px; }
        .rank-1 { color: var(--gold); }
        .rank-2 { color: var(--silver); }
        .rank-3 { color: var(--bronze); }
        
        .loading, .error { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 16px; }
        .error { color: #f43f5e; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ 불문율 길드</h1>
            <p>제우스 오만의신 길드원 실시간 전투력 랭킹 시스템</p>
        </header>
        
        <div class="card">
            <div id="loading" class="loading">구글 시트에서 데이터를 불러오는 중입니다...</div>
            <div id="error" class="error" style="display:none;"></div>
            <div class="table-wrapper">
                <table id="rankTable" style="display: none;">
                    <thead>
                        <tr>
                            <th class="rank">순위</th>
                            <th>캐릭터명</th>
                            <th>직업</th>
                            <th>전투력</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 구글 시트 CSV 자동 연동 주소
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSEnzrZjlL9xsghEn2UwvULebdfVxxDkdX_bqXZpprWKMwFv-zEf8QYo-WtE95nDXCqPlBLCc2v71vG/pub?output=csv';

        async function loadData() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('데이터를 불러오지 못했습니다.');
                const text = await response.text();
                parseAndRender(text);
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                const errEl = document.getElementById('error');
                errEl.style.display = 'block';
                errEl.innerText = '데이터 로드 실패: ' + err.message;
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(line => {
                const row = [];
                let inQuotes = false;
                let current = '';
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                return row.map(cell => cell.replace(/^"|"$/g, ''));
            });
            return lines.filter(row => row.some(cell => cell !== ''));
        }

        function parseAndRender(csvText) {
            const rows = parseCSV(csvText);
            if (rows.length < 2) {
                throw new Error('시트에 데이터가 없습니다.');
            }

            // 첫 번째 줄(헤더)을 제외하고 데이터 추출 (열 순서: 캐릭터명, 직업, 전투력)
            const dataRows = rows.slice(1);
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            dataRows.forEach((cols, index) => {
                if (cols.length < 3) return;
                
                const tr = document.createElement('tr');
                const rankNum = index + 1;
                
                let rankClass = 'rank';
                if (rankNum === 1) rankClass += ' rank-1';
                else if (rankNum === 2) rankClass += ' rank-2';
                else if (rankNum === 3) rankClass += ' rank-3';

                tr.innerHTML = `
                    <td class="${rankClass}">${rankNum}</td>
                    <td><strong>${cols[0] || ''}</strong></td>
                    <td>${cols[1] || ''}</td>
                    <td>${cols[2] || ''}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('rankTable').style.display = 'table';
        }

        loadData();
    </script>
</body>
</html>
